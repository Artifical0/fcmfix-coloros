name: Tagged release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Validate version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle)
          test "$GITHUB_REF_NAME" = "v$VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleRelease
      - name: Sign APK
        uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNINGKEYBASE64 }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTOREPASSWORD }}
          keyPassword: ${{ secrets.KEYPASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.0'
      - name: Verify and hash
        shell: bash
        run: |
          cd app/build/outputs/apk/release
          mv app-release-unsigned-signed.apk "fcmfix-coloros-$VERSION_NAME.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "fcmfix-coloros-$VERSION_NAME.apk"
          sha256sum "fcmfix-coloros-$VERSION_NAME.apk" > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FCMFix ColorOS (${{ env.VERSION_NAME }})
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          body_path: docs/releases/${{ env.VERSION_NAME }}.md
          files: |
            app/build/outputs/apk/release/fcmfix-coloros-${{ env.VERSION_NAME }}.apk
            app/build/outputs/apk/release/SHA256SUMS

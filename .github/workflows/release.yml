name: Tagged release
on:
  push:
    tags: ['v*']
# 和 android.yml 同组：同一提交上推送 master 触发的那次还在跑就取消，发版只构建一次。
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Validate version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle)
          test "$GITHUB_REF_NAME" = "v$VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleRelease
      - name: Sign, verify and hash
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNINGKEYBASE64 }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTOREPASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYPASSWORD }}
        run: |
          set -euo pipefail
          for v in SIGNING_KEY_BASE64 KEY_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD; do
            [ -n "${!v:-}" ] || { echo "::error::missing signing secret $v"; exit 1; }
          done
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          cd app/build/outputs/apk/release
          APK="fcmfix-coloros-$VERSION_NAME.apk"
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          "$BT/zipalign" -f -p 4 app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD --out "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$APK"
          sha256sum "$APK" > SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: FCMFix ColorOS (${{ env.VERSION_NAME }})
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          body_path: docs/releases/${{ env.VERSION_NAME }}.md
          files: |
            app/build/outputs/apk/release/fcmfix-coloros-${{ env.VERSION_NAME }}.apk
            app/build/outputs/apk/release/SHA256SUMS

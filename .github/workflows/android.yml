name: Android CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      # Tagging fails late if the release notes are missing; catch it on every push instead.
      - name: Check release notes
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle)
          test -f "docs/releases/$VERSION_NAME.md" || { echo "::error::missing docs/releases/$VERSION_NAME.md"; exit 1; }
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
